  color:var(--blaze);margin-bottom:10px}
h1{font-size:clamp(29px,6.4vw,42px);font-weight:800;font-style:italic;letter-spacing:-.02em;
  line-height:1;margin:0;text-transform:uppercase}
.tag{color:var(--dim);font-size:14px;margin-top:12px;max-width:44ch;margin-inline:auto}

/* ---------- card ---------- */
.card{background:rgba(17,17,20,.92);border:1px solid var(--line);border-radius:3px;
  padding:24px 22px;backdrop-filter:blur(7px)}
.rule{height:2px;background:var(--blaze);width:44px;margin-bottom:20px}

label.fl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);margin:0 0 7px}
.fieldwrap{margin-bottom:19px}
.help{font-size:12px;color:var(--faint);margin:6px 0 0}

input[type=text],input[type=password],textarea,select{
  width:100%;background:#0C0C0F;border:1px solid var(--line-2);color:var(--white);
  border-radius:2px;padding:11px 12px;font:inherit;font-size:15px;font-family:var(--sans)}
textarea{min-height:132px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--blaze);box-shadow:0 0 0 3px rgba(255,107,26,.14)}
input::placeholder,textarea::placeholder{color:#4E4E57}

/* ---------- combobox ---------- */
.cb{position:relative}
.cb-list{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);background:#0C0C0F;
  border:1px solid var(--line-2);border-radius:2px;max-height:246px;overflow-y:auto;display:none;
  box-shadow:0 14px 34px rgba(0,0,0,.6)}
.cb-list.open{display:block}
.cb-opt{padding:9px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid rgba(38,38,44,.6)}
.cb-opt:last-child{border-bottom:0}
.cb-opt:hover,.cb-opt.active{background:var(--blaze);color:#141006;font-weight:600}
.cb-opt b{color:var(--blaze);font-weight:700}
.cb-opt:hover b,.cb-opt.active b{color:#141006}
.cb-none{padding:11px 12px;color:var(--faint);font-size:13px}
.cb-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--faint);cursor:pointer;font-size:17px;line-height:1;padding:3px 5px;display:none}
.cb-clear.on{display:block}
.cb-clear:hover{color:var(--white)}

/* ---------- award picker ---------- */
.awardsel{display:grid;gap:7px}
.aw-opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line-2);border-radius:2px;
  padding:11px 13px;cursor:pointer;background:#0C0C0F;transition:border-color .13s,background .13s}
.aw-opt:hover{border-color:var(--line-2);background:#131317}
.aw-opt.sel{border-color:var(--blaze);background:rgba(255,107,26,.07)}
.aw-opt input{margin:3px 0 0;accent-color:var(--blaze);flex:none;width:15px;height:15px}
.aw-name{font-weight:700;font-size:13.5px;letter-spacing:.02em;text-transform:uppercase;display:block}
.aw-desc{color:var(--dim);font-size:12.5px;line-height:1.45;margin-top:3px;display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blaze);
  color:#140E06;border:0;border-radius:2px;padding:13px 22px;font-family:var(--sans);font-size:13px;
  font-weight:700;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;transition:filter .13s}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.wide{width:100%;padding:15px}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line-2)}
.btn.ghost:hover{color:var(--white);border-color:var(--faint);filter:none}
.btn.sm{padding:8px 13px;font-size:11px}
.btn:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

.err{background:rgba(255,80,60,.1);border:1px solid #A8382A;color:#FF9E8C;border-radius:2px;
  padding:11px 13px;font-size:13.5px;margin-top:15px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(20,14,6,.3);
  border-top-color:#140E06;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.2s}}

/* ---------- thanks ---------- */
.thanks{text-align:center;padding:20px 6px 8px}
.thanks .mark{width:74px;margin:0 auto 22px;display:block}
.thanks h2{font-size:27px;font-weight:800;font-style:italic;text-transform:uppercase;margin:0 0 12px;
  letter-spacing:-.01em}
.thanks p{color:var(--dim);max-width:38ch;margin:0 auto 26px}

/* ---------- admin link ---------- */
.adminlink{text-align:center;margin-top:26px}
.adminlink button{background:none;border:0;color:var(--faint);font-family:var(--mono);font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:6px}
.adminlink button:hover{color:var(--blaze)}

/* ---------- admin ---------- */
.crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:20px;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.crumb button{background:none;border:0;color:var(--blaze);font:inherit;cursor:pointer;padding:0}
.crumb button:hover{text-decoration:underline}

.bubbles{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:13px}
.bubble{position:relative;background:rgba(17,17,20,.92);border:1px solid var(--line);border-radius:200px;
  padding:22px 24px;cursor:pointer;text-align:left;color:var(--white);font-family:var(--sans);
  transition:border-color .15s,transform .15s,background .15s;backdrop-filter:blur(7px);
  display:flex;align-items:center;gap:15px}
.bubble:hover{border-color:var(--blaze);transform:translateY(-2px);background:rgba(23,23,27,.95)}
@media(prefers-reduced-motion:reduce){.bubble{transition:none}.bubble:hover{transform:none}}
.bubble .n{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--blaze);
  font-variant-numeric:tabular-nums;line-height:1;flex:none;min-width:38px}
.bubble .t{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.28}
.bubble .s{font-size:11px;color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400;
  margin-top:3px;display:block}
.bubble.empty .n{color:var(--faint)}

.row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:rgba(17,17,20,.92);
  border:1px solid var(--line);border-radius:2px;margin-bottom:8px;cursor:pointer;
  transition:border-color .13s;backdrop-filter:blur(7px)}
.row:hover{border-color:var(--blaze)}
.row .rk{font-family:var(--mono);font-size:12px;color:var(--faint);min-width:24px}
.row .rk.top{color:var(--blaze);font-weight:700}
.row .nm{font-weight:600;flex:1;font-size:15px}
.row .ct{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:right;line-height:1.45}
.row .ct b{color:var(--blaze);font-size:15px}

.entry{background:rgba(17,17,20,.92);border:1px solid var(--line);border-left:2px solid var(--blaze);
  border-radius:2px;padding:15px 17px;margin-bottom:9px;backdrop-filter:blur(7px)}
.entry .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-bottom:9px}
.entry .meta b{color:var(--white);font-weight:700}
.entry p{margin:0;white-space:pre-wrap;line-height:1.65;font-size:14.5px}

h2.sec{font-size:22px;font-weight:800;font-style:italic;text-transform:uppercase;margin:0 0 4px;
  letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13px;margin:0 0 20px}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.empty-state{text-align:center;padding:46px 18px;color:var(--faint);font-size:13.5px;
  border:1px dashed var(--line-2);border-radius:2px}
.empty-state b{display:block;font-size:16px;font-style:italic;font-weight:800;color:var(--dim);
  margin-bottom:7px;text-transform:uppercase}
.entry .meta .del{background:none;border:0;color:var(--faint);font:inherit;font-family:var(--mono);
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:0 0 0 10px}
  .entry .meta .del:hover{color:#FF6B5A}
  .entry.confirming{border-left-color:#A8382A}
  .entry .confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px;
    padding-top:11px;border-top:1px solid var(--line)}
  .entry .confirm span{font-size:12.5px;color:#FF9E8C;flex:1;min-width:150px}
  .btn.danger{background:#A8382A;color:#fff}
  .btn.danger:hover{filter:brightness(1.14)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--blaze);
  color:#140E06;font-weight:700;font-size:13px;padding:11px 20px;border-radius:2px;z-index:90;
  box-shadow:0 8px 26px rgba(0,0,0,.5)}
</style>
</head>

</div>

const $  = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const view = $("view");

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined,

/* Searchable combobox over a list of names. */
function combo(id, placeholder){
  return `<div class="cb">
    <input type="text" id="${id}" autocomplete="off" role="combobox" aria-expanded="false"
      aria-autocomplete="list" aria-controls="${id}-list" placeholder="${esc(placeholder)}">
    <button type="button" class="cb-clear" id="${id}-x" aria-label="Clear">&times;</button>
    <div class="cb-list" id="${id}-list" role="listbox"></div>
  </div>`;
}

function wireCombo(id, getOptions, onPick){
  const input = $(id), list = $(id + "-list"), clear = $(id + "-x");
  let chosen = "", active = -1;

  const render = () => {
    const q = input.value.trim().toLowerCase();
    const opts = getOptions().filter(n => !q || n.toLowerCase().includes(q));
    active = -1;
    if(!opts.length){
      list.innerHTML = `<div class="cb-none">No match</div>`;
    } else {
      list.innerHTML = opts.slice(0, 60).map((n, i) => {
        const at = q ? n.toLowerCase().indexOf(q) : -1;
        const label = at < 0 ? esc(n)
          : esc(n.slice(0, at)) + "<b>" + esc(n.slice(at, at + q.length)) + "</b>" + esc(n.slice(at + q.length));
        return `<div class="cb-opt" role="option" data-i="${i}" data-v="${esc(n)}">${label}</div>`;
      }).join("");
      list.querySelectorAll(".cb-opt").forEach(o =>
        o.addEventListener("mousedown", e => { e.preventDefault(); pick(o.dataset.v); }));
    }
    open(true);
  };
  const open = on => { list.classList.toggle("open", on); input.setAttribute("aria-expanded", String(on)); };
  const pick = v => {
    chosen = v; input.value = v; clear.classList.add("on"); open(false);
    if(onPick) onPick(v);
  };

  input.addEventListener("focus", render);
  input.addEventListener("input", () => {
    chosen = ""; clear.classList.toggle("on", !!input.value);
    if(onPick) onPick("");
    render();
  });
  input.addEventListener("blur", () => setTimeout(() => open(false), 120));
  input.addEventListener("keydown", e => {
    const opts = [...list.querySelectorAll(".cb-opt")];
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      if(!list.classList.contains("open")) return render();
      active += (e.key === "ArrowDown" ? 1 : -1);
      if(active < 0) active = opts.length - 1;
      if(active >= opts.length) active = 0;
      opts.forEach((o, i) => o.classList.toggle("active", i === active));
      if(opts[active]) opts[active].scrollIntoView({ block:"nearest" });
    }
    if(e.key === "Enter" && list.classList.contains("open")){
      e.preventDefault();
      if(active >= 0 && opts[active]) pick(opts[active].dataset.v);
      else if(opts.length === 1) pick(opts[0].dataset.v);
    }
    if(e.key === "Escape") open(false);
  });
  clear.addEventListener("click", () => {
    chosen = ""; input.value = ""; clear.classList.remove("on");
    if(onPick) onPick(""); input.focus();
  });

  return { get value(){ return chosen; }, reset(){ chosen=""; input.value=""; clear.classList.remove("on"); } };
}

async function submitEntry(){
  const err = $("formerr"), btn = $("submit");
  const nominator = nomCombo.value, nominee = subCombo.value;
  const comment = $("comment").value.trim();

  const problems = [];
  if(!nominator) problems.push("pick your name from the list");
  if(!nominee)   problems.push("pick who you are recognizing");
  if(!pickedAward) problems.push("choose an award");
  if(comment.length < 10) problems.push("write a bit about why they deserve it");
  if(problems.length){
    err.innerHTML = `<div class="err">Almost there \u2014 please ${problems.join(", ")}.</div>`;
    return;
  }
  if(nominator === nominee){
    err.innerHTML = `<div class="err">You cannot nominate yourself.</div>`;
    return;
  }

  err.innerHTML = ""; btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Submitting`;
  const { error } = await db.from("awards_entries")
    .insert({ nominator, nominee, award: pickedAward, comment });
  btn.disabled = false; btn.textContent = "Submit nomination";
  if(error){ err.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  renderThanks(nominee);
}

}

/* Rank by distinct nominators first — one enthusiastic person
   writing five entries should not outrank broad support. */
function tally(award){
  const es = DATA.filter(e => e.award === award);
  const by = {};
  es.forEach(e => {
    (by[e.nominee] ||= { nominee:e.nominee, entries:[], voters:new Set() });
    by[e.nominee].entries.push(e);
    by[e.nominee].voters.add(e.nominator);
  });
  return Object.values(by).sort((a,b) =>
    b.voters.size - a.voters.size || b.entries.length - a.entries.length ||
    a.nominee.localeCompare(b.nominee));
}

/* ---- level 2: nominees for one award ---- */
function renderAward(award){
  const parts = [{ t:"Awards", fn:renderAwards }, { t:award }];
  const list = tally(award);
  const desc = (AWARDS.find(a => a[0] === award) || [])[1] || "";
  view.innerHTML = crumbs(parts) + `
    <h2 class="sec">${esc(award)}</h2>
    <p class="sub">${esc(desc)}</p>
    ${list.length ? `<div class="tools">

    </div>` : ""}

      <div class="row" data-nm="${esc(r.nominee)}" data-aw="${esc(award)}">
        <span class="rk ${i===0?"top":""}">${i+1}</span>
        <span class="nm">${esc(r.nominee)}</span>
        <span class="ct"><b>${r.voters.size}</b> ${r.voters.size===1?"person":"people"}<br>

    r.addEventListener("click", () => renderNominee(r.dataset.aw, r.dataset.nm)));
  if(list.length) $("xaw").addEventListener("click", () => exportAward(award));
}

/* ---- level 3: every entry for one nominee ---- */
function renderNominee(award, nominee){
  const parts = [{ t:"Awards", fn:renderAwards },
                 { t:award, fn:() => renderAward(award) },
                 { t:nominee }];
  const es = DATA.filter(e => e.award === award && e.nominee === nominee)
                 .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  const voters = new Set(es.map(e => e.nominator)).size;
  view.innerHTML = crumbs(parts) + `
    <h2 class="sec">${esc(nominee)}</h2>
    <p class="sub">${es.length} submission${es.length===1?"":"s"} from ${voters} ${voters===1?"person":"people"} for ${esc(award)}</p>
    <div class="tools"><button class="btn ghost sm" id="copy">Copy all as text</button></div>
    ${es.map(e => `
      <div class="entry" id="e-${e.id}">
        <div class="meta"><span>From <b>${esc(e.nominator)}</b></span>
          <span>${fmtDate(e.created_at)}<button class="del" data-del="${e.id}">Delete</button></span></div>
        <p>${esc(e.comment)}</p>
      </div>`).join("")}`;
  wireCrumbs(parts);
  document.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", () => confirmDelete(b.dataset.del, award, nominee)));
  $("copy").addEventListener("click", () => {
    const txt = `${nominee} \u2014 ${award}\n${es.length} submissions from ${voters} people\n\n` +
      es.map(e => `From ${e.nominator} (${fmtDate(e.created_at)}):\n${e.comment}`).join("\n\n");
    navigator.clipboard.writeText(txt).then(() => toast("Copied to clipboard"),
      () => toast("Could not copy"));
  });
}

/* Two-step delete. Nominations are not recoverable, so the confirm
   lives inline on the card rather than in a browser dialog that is
   easy to dismiss by reflex. */
function confirmDelete(id, award, nominee){
  const card = $("e-" + id);
  if(!card || card.querySelector(".confirm")) return;
  card.classList.add("confirming");
  const box = document.createElement("div");
  box.className = "confirm";
  box.innerHTML = `<span>Delete this nomination for good?</span>
    <button class="btn danger sm" data-yes>Delete</button>
    <button class="btn ghost sm" data-no>Cancel</button>`;
  card.appendChild(box);
  box.querySelector("[data-no]").addEventListener("click", () => {
    card.classList.remove("confirming"); box.remove();
  });
  box.querySelector("[data-yes]").addEventListener("click", async e => {
    const btn = e.currentTarget;
    btn.disabled = true; btn.innerHTML = `<span class="spin"></span>`;
    const { error } = await db.rpc("awards_delete_entry", { pw: ADMIN_PW, p_id: id });
    if(error){
      box.querySelector("span").textContent = /authoris|authoriz/i.test(error.message)
        ? "Session expired \u2014 log out and back in." : error.message;
      btn.disabled = false; btn.textContent = "Delete"; return;
    }
    DATA = DATA.filter(x => x.id !== id);
    toast("Nomination deleted");
    // If that was the last one for this nominee, there is nothing left to show.
    const left = DATA.filter(x => x.award === award && x.nominee === nominee).length;
    if(left) renderNominee(award, nominee); else renderAward(award);
  });
}

      { pw: ADMIN_PW, p_id: b.dataset.tog, p_active: b.dataset.act !== "1" });
    if(error){ toast("Could not update"); b.disabled = false; return; }
    await loadPeople(); renderPeople();
  }));
  document.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", async () => {
    if(!confirm(`Remove ${b.dataset.nm} from the list completely?`)) return;
    b.disabled = true;
    const { error } = await db.rpc("awards_delete_person", { pw: ADMIN_PW, p_id: b.dataset.rm });
    if(error){ toast(error.message.replace(/^.*?:\s*/, "")); b.disabled = false; return; }
    await loadPeople(); renderPeople(); toast(b.dataset.nm + " removed");
  }));
  $("newname").focus();
}

async function addPerson(){
  const inp = $("newname"), btn = $("addbtn"), err = $("perr");
  const name = inp.value.trim();
  if(name.length < 2){ err.innerHTML = `<div class="err">Enter a full name.</div>`; return; }
  err.innerHTML = ""; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>`;
  const { error } = await db.rpc("awards_add_person", { pw: ADMIN_PW, p_name: name });
  btn.disabled = false; btn.textContent = "Add";
  if(error){
    err.innerHTML = `<div class="err">${esc(
      /already/i.test(error.message) ? name + " is already on the list."
      : /authoris|authoriz/i.test(error.message) ? "Your session expired. Log out and back in."
      : error.message)}</div>`;
    return;

  await loadPeople();
  renderPeople(`<div class="err" style="background:rgba(255,107,26,.1);border-color:var(--blaze-dim);color:var(--blaze)">${esc(name)} added.</div>`);
  toast(name + " added");
}

   EXPORT
   ============================================================ */
const SAFE = s => s.replace(/[\\\/\?\*\[\]:]/g, "").slice(0, 31);

function autoWidth(rows){
  if(!rows.length) return [];
  return Object.keys(rows[0]).map(k =>
    ({ wch: Math.min(70, Math.max(k.length + 2,
        ...rows.map(r => String(r[k] ?? "").length + 2))) }));
}

function awardSheet(award){
  const rows = [];
  tally(award).forEach((r, i) => r.entries
    .sort((a,b) => new Date(a.created_at) - new Date(b.created_at))
    .forEach(e => rows.push({
      Rank: i + 1, Nominee: r.nominee,
      "Distinct Nominators": r.voters.size, "Total Submissions": r.entries.length,
      "Nominated By": e.nominator, Date: fmtDate(e.created_at), Comment: e.comment
    })));
  return rows;
}

function exportAward(award){
  const rows = awardSheet(award);
  if(!rows.length){ toast("Nothing to export"); return; }
  const ws = XLSX.utils.json_to_sheet(rows); ws["!cols"] = autoWidth(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, SAFE(award));
  XLSX.writeFile(wb, `BURLEBO Awards - ${award.replace(/[\\\/:*?"<>|]/g,"")}.xlsx`);
  toast("Downloaded");
}

function exportAll(){
  if(!DATA.length){ toast("Nothing to export"); return; }
  const wb = XLSX.utils.book_new();

  const summary = [];
  AWARDS.forEach(([name]) => tally(name).forEach((r, i) => summary.push({
    Award: name, Rank: i + 1, Nominee: r.nominee,
    "Distinct Nominators": r.voters.size, "Total Submissions": r.entries.length
  })));
  const s1 = XLSX.utils.json_to_sheet(summary.length ? summary
    : [{ Award:"", Rank:"", Nominee:"", "Distinct Nominators":"", "Total Submissions":"" }]);
  s1["!cols"] = autoWidth(summary); s1["!freeze"] = { xSplit:0, ySplit:1 };
  XLSX.utils.book_append_sheet(wb, s1, "Summary");

  const all = DATA.slice().sort((a,b) => new Date(a.created_at) - new Date(b.created_at))
    .map(e => ({ Date: fmtDate(e.created_at), Award: e.award, Nominee: e.nominee,
                 "Nominated By": e.nominator, Comment: e.comment }));
  const s2 = XLSX.utils.json_to_sheet(all); s2["!cols"] = autoWidth(all);
  XLSX.utils.book_append_sheet(wb, s2, "All Entries");

  AWARDS.forEach(([name]) => {
    const rows = awardSheet(name);
    if(!rows.length) return;
    const ws = XLSX.utils.json_to_sheet(rows); ws["!cols"] = autoWidth(rows);
    XLSX.utils.book_append_sheet(wb, ws, SAFE(name));
  });

  const d = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `BURLEBO Awards - All Nominations ${d}.xlsx`);
  toast("Downloaded");
}

  if(await loadPeople() && !ADMIN_PW) renderForm();   // repaint if the live roster differs
})();
